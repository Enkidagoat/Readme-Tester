name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint, type check, hermetic tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,openai]"

      - name: Lint (ruff)
        run: make lint

      - name: Type check (mypy --strict)
        run: make type

      - name: Hermetic tests (no Docker, no API key)
        run: make test

  e2e-docker:
    name: real-sandbox e2e (Docker)
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,openai]"

      # test-docker uses a scripted FakeLLM (tests/conftest.py) against the
      # real container, so it needs Docker but no LLM credential.
      - name: Real-sandbox e2e tests
        run: make test-docker
          - name: Real-sandbox e2e tests
            run: make test-docker
