name: Badge

# Self-audit: run the real pipeline against this repository's own README and
# publish the resulting badge.json + Truth Report to the `badges` branch, so
# the badge embedded in README.md stays a checkable, receipt-backed artifact
# rather than a hand-placed claim (see "The badge" in README.md).

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: badge-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check for an LLM credential (Anthropic or OpenAI-compatible)
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${OPENAI_API_KEY:-}" ] || [ -n "${FEATHERLESS_API_KEY:-}" ]; then
            echo "provider=openai" >> "$GITHUB_OUTPUT"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No LLM credential found; skipping badge self-audit."
          fi

      - name: Run liedetector against this repository
        if: steps.creds.outputs.has_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEATHERLESS_API_KEY: ${{ secrets.FEATHERLESS_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          if [ -n "${OPENAI_MODEL:-}" ]; then
            liedetector run "https://github.com/${{ github.repository }}" --provider ${{ steps.creds.outputs.provider }} --model "$OPENAI_MODEL"
          else
            liedetector run "https://github.com/${{ github.repository }}" --provider ${{ steps.creds.outputs.provider }}
          fi

      - name: Locate the freshest receipt
        if: steps.creds.outputs.has_key == 'true'
        id: receipt
        run: |
          latest="$(ls -t receipts/*/verification_receipt.json | head -n1)"
          commit="$(python3 -c "import json; print(json.load(open('$latest'))['commit_sha'][:12])")"
          echo "dir=$(dirname \"$latest\")" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Publish badge.json and Truth Report to the badges branch
        if: steps.creds.outputs.has_key == 'true'
        env:
          RECEIPT_DIR: ${{ steps.receipt.outputs.dir }}
          COMMIT: ${{ steps.receipt.outputs.commit }}
        run: |
          set -euo pipefail
          badge="$RECEIPT_DIR/badge.json"
          report="reports/$COMMIT.html"
          cp "$badge" /tmp/badge.json
          cp "$report" /tmp/report.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin badges 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . > /dev/null 2>&1 || true
          fi

          cp /tmp/badge.json ./badge.json
          cp /tmp/report.html ./report.html

          git add badge.json report.html
          if git diff --cached --quiet; then
            echo "No badge changes to publish."
          else
            git commit -m "Update badge: self-audit at ${COMMIT}"
            git push origin badges
          fi
